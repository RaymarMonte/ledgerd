spring:
  application:
    name: ledgerd
  datasource:
    url: jdbc:postgresql://localhost:5433/mydatabase
    username: ledgerd
    password: ledgerd
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration